version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nexcell-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Error: falta definir DB_PASS en el .env}
      MYSQL_DATABASE: ${DB_NAME:-"nexcell_db"}
    ports:
      - "3308:3306"
    volumes:
      - nexcell_db_data:/var/lib/mysql

  api:
    build: .
    container_name: nexcell-ia-agent
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?Error: falta definir GROQ_API_KEY en el .env}
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS:?Error: falta definir DB_PASS en el .env}
      - DB_NAME=${DB_NAME:-"nexcell_db"}
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  nexcell_db_data:
